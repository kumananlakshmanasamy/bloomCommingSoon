# Optional: use this if you pick the "Docker Compose" build pack in Coolify,
# or to run locally with `docker compose up --build` → http://localhost:8080
services:
  bloom-launch:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"   # Coolify ignores host ports when a domain is set; safe to keep for local runs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
