<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bloom &amp; body co. — launching soon</title>
  <meta name="description" content="bloom &amp; body co. is almost here. Skincare made for an effortless glow — launching soon.">
  <meta name="theme-color" content="#F9F3EE">

  <meta property="og:type" content="website">
  <meta property="og:title" content="bloom &amp; body co. — launching soon">
  <meta property="og:description" content="Something soft is unfolding. Skincare made for an effortless glow — launching soon.">
  <meta property="og:image" content="assets/hero.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" href="assets/bloom-symbol-coral.png">
  <link rel="apple-touch-icon" href="assets/bloom-symbol.png">
  <link rel="preload" href="assets/fonts/all-round-gothic-book.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/all-round-gothic-bold.woff2" as="font" type="font/woff2" crossorigin>

  <style>
    @font-face { font-family: 'all-round-gothic'; src: url('assets/fonts/all-round-gothic-book.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'all-round-gothic'; src: url('assets/fonts/all-round-gothic-medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
    @font-face { font-family: 'all-round-gothic'; src: url('assets/fonts/all-round-gothic-bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }

    :root {
      --cream: #F9F3EE;
      --sand: #EED5BE;
      --peach: #FCA995;
      --coral: #DA7664;
      --clay: #A84F40;   /* deeper coral for text/buttons (readable contrast) */
      --ink: #3A211B;
      --white: #FFFFFF;
      --font: 'all-round-gothic', 'Century Gothic', 'Avenir Next', system-ui, sans-serif;
      --ease: cubic-bezier(.22, .61, .36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font);
      background: var(--cream);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    /* Brand marks: pre-tinted PNGs (work on file:// and the server) */
    .mark { display: block; height: auto; }

    /* ---------- Layout ---------- */
    .page {
      min-height: 100svh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
    }

    .panel {
      display: flex;
      flex-direction: column;
      padding: clamp(24px, 4vw, 56px) clamp(16px, 5vw, 80px);
      gap: 40px;
      position: relative;
      overflow: hidden;
    }
    /* soft swirl of colour behind the content */
    .panel::before {
      content: '';
      position: absolute;
      width: 70vmax; height: 70vmax;
      left: -35vmax; bottom: -40vmax;
      background: radial-gradient(closest-side, rgba(252,169,149,.35), rgba(238,213,190,.25) 55%, transparent 72%);
      pointer-events: none;
    }
    .panel > * { position: relative; }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--coral);
    }
    .top .mark--symbol { width: 44px; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border: 1px solid rgba(218,118,100,.45);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: lowercase;
      color: var(--clay);
      background: rgba(255,255,255,.5);
    }
    .pill .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--coral);
    }

    .content {
      margin-block: auto;
      max-width: 520px;
    }
    .content .mark--word {
      width: min(100%, 440px);
      color: var(--coral);
      margin-bottom: clamp(28px, 4vw, 44px);
    }
    h2 {
      margin: 0 0 18px;
      font-weight: 700;
      font-size: clamp(34px, 4.4vw, 58px);
      line-height: 1.02;
      letter-spacing: -.02em;
      color: var(--ink);
    }
    h2 em { font-style: normal; color: var(--clay); }
    .lede {
      margin: 0;
      font-size: clamp(16px, 1.25vw, 18px);
      line-height: 1.6;
      color: rgba(58,33,27,.78);
      max-width: 44ch;
    }

    footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      color: rgba(58,33,27,.76);
    }

    /* ---------- Visual ---------- */
    .visual {
      position: relative;
      margin: 12px 12px 12px 0;
      border-radius: 28px;
      overflow: hidden;
      background: var(--sand);
    }
    .visual > img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: 52% 45%;
      animation: unveil 2.2s var(--ease) both;
    }
    .visual::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(58,33,27,0) 55%, rgba(58,33,27,.65) 100%);
    }
    .caption {
      position: absolute;
      left: clamp(20px, 3vw, 40px);
      right: clamp(20px, 3vw, 40px);
      bottom: clamp(20px, 3vw, 36px);
      z-index: 1;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      color: var(--white);
    }
    .caption p {
      margin: 0;
      font-size: clamp(22px, 2.4vw, 34px);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -.01em;
      max-width: 13ch;
    }
    .caption .mark--symbol { width: 54px; color: rgba(255,255,255,.9); flex: none; }

    /* ---------- Motion ---------- */
    @keyframes unveil {
      from { transform: scale(1.12); filter: blur(8px) saturate(.8); opacity: .4; }
      to   { transform: scale(1);    filter: blur(0) saturate(1);    opacity: 1; }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }
    .reveal { animation: rise .9s var(--ease) both; }
    .reveal:nth-child(2) { animation-delay: .08s; }
    .reveal:nth-child(3) { animation-delay: .16s; }
    .reveal:nth-child(4) { animation-delay: .24s; }
    .reveal:nth-child(5) { animation-delay: .32s; }

    /* Photo: after the unveil, a slow, endless drift */
    @keyframes drift {
      0%   { transform: scale(1)    translate(0, 0); }
      100% { transform: scale(1.07) translate(-1.2%, -1%); }
    }
    .visual > img {
      animation: unveil 2.2s var(--ease) both,
                 drift 18s ease-in-out 2.2s infinite alternate;
    }

    /* Wordmark: soft left-to-right wipe */
    @keyframes wipe {
      from { clip-path: inset(0 100% 0 0); opacity: .3; }
      to   { clip-path: inset(0 0 0 0);    opacity: 1; }
    }
    .content .mark--word.reveal { animation: wipe 1.3s var(--ease) .15s both; }

    /* "unfolding." blooms in after the headline */
    @keyframes bloom {
      from { opacity: 0; filter: blur(10px); letter-spacing: .06em; }
      to   { opacity: 1; filter: blur(0);    letter-spacing: -.02em; }
    }
    h2 em { display: inline-block; animation: bloom 1.4s var(--ease) .55s both; }

    /* Symbol: gentle sway, like a petal */
    @keyframes sway {
      0%, 100% { transform: rotate(-6deg) translateY(0); }
      50%      { transform: rotate(6deg)  translateY(-3px); }
    }
    .top .mark--symbol { animation: sway 6s ease-in-out infinite; transform-origin: 50% 60%; }

    /* Background swirl breathes slowly */
    @keyframes breathe {
      0%, 100% { transform: translate(0, 0) scale(1);       opacity: .9; }
      50%      { transform: translate(6vmax, -4vmax) scale(1.12); opacity: 1; }
    }
    .panel::before { animation: breathe 14s ease-in-out infinite; }

    /* Caption arrives once the photo is in focus */
    .caption p { animation: rise 1s var(--ease) 1.1s both; }
    @keyframes spin-in {
      from { opacity: 0; transform: rotate(-90deg) scale(.6); }
      to   { opacity: .9; transform: none; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    .caption .mark--symbol {
      animation: spin-in 1.2s var(--ease) 1.4s both,
                 float 5s ease-in-out 2.6s infinite;
    }


    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* ---------- Mobile ---------- */
    @media (max-width: 900px) {
      .page { grid-template-columns: 1fr; }
      .visual {
        order: -1;
        margin: 12px 12px 0;
        min-height: 42svh;
        border-radius: 22px;
      }
      .panel { gap: 28px; padding-top: 24px; }
      .top .mark--symbol { width: 36px; }
      .content { margin-block: 0; }
      .content .mark--word { margin-bottom: 24px; }
      .caption .mark--symbol { display: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="panel" aria-labelledby="headline">
      <header class="top reveal">
        <img class="mark mark--symbol" src="assets/bloom-symbol-coral.png" width="300" height="290" alt="">
        <span class="pill"><span class="dot" aria-hidden="true"></span>launching soon</span>
      </header>

      <div class="content">
        <h1 class="sr-only">bloom &amp; body co.</h1>
        <img class="mark mark--word reveal" src="assets/bloom-wordmark-coral.png" width="1200" height="172" alt="">

        <h2 id="headline" class="reveal">Something soft<br>is <em>unfolding.</em></h2>
        <p class="lede reveal">
          Skincare made for an effortless glow. We're putting the finishing touches on our first
          collection — we'll be opening the doors very soon.
        </p>
      </div>

      <footer class="reveal">
        <span>© <span id="year">2026</span> bloom &amp; body co.</span>
      </footer>
    </section>

    <figure class="visual" aria-hidden="true">
      <img src="assets/hero.jpg"
           srcset="assets/hero-sm.jpg 900w, assets/hero.jpg 1920w"
           sizes="(max-width: 900px) 100vw, 52vw"
           alt="" fetchpriority="high">
      <figcaption class="caption">
        <p>Unwrapping something new.</p>
        <img class="mark mark--symbol" src="assets/bloom-symbol-white.png" width="300" height="290" alt="">
      </figcaption>
    </figure>
  </main>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
