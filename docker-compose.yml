# Used by Coolify's "Docker Compose" build pack, and locally with `docker compose up --build`.
# No host port is published here: Coolify's proxy (Traefik) routes your domain to container port 80.
# Publishing a host port (e.g. 8080) collides with other services on the server.
# For local runs, docker-compose.override.yml (auto-loaded locally, ignored by Coolify) maps 8080 → 80.
services:
  bloom-launch:
    build: .
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
